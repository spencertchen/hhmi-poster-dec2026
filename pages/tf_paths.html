<script>
 const EXTRA_LABELS = ["M cell path", "M cell path", "M cell path"];
 function showTab(k) {
   const panels = document.querySelectorAll('.tab-panel');
   panels.forEach((d,i) => d.style.display = (i===k ? 'flex' : 'none'));
   document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===k));
   document.body.classList.toggle('body-dark', panels[k].classList.contains('dark'));
   window.dispatchEvent(new Event('resize'));
 }
 function toggleExtra(k) {
   const cols = document.querySelectorAll('.extra-' + k);
   const hidden = cols[0].style.display === 'none';
   cols.forEach(c => c.style.display = hidden ? '' : 'none');
   document.getElementById('t' + k).textContent = (hidden ? 'Hide ' : 'Show ') + EXTRA_LABELS[k];
   window.dispatchEvent(new Event('resize'));
 }
 showTab(0);
